version: 2
updates:
  - package-ecosystem: uv
    directory: /engine
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      # PyTorch is pinned to the CUDA build index on purpose; update by hand.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
