[package]
name = "grain-search"
version = "0.1.0"
description = "Grain Search: search your files and photos by meaning on Windows, with EmbeddingGemma 2"
license = "MIT"
repository = "https://github.com/saifu7/grain-search"
edition = "2021"

[lib]
name = "grain_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
