[project]
name = "grain-search"
version = "0.1.0"
description = "Search your files and photos by meaning, locally, with Google's EmbeddingGemma 2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["search", "semantic-search", "embeddings", "embeddinggemma", "desktop-search", "image-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sentence-transformers[image]>=5.1",   # [image] = Pillow + torchvision: the EmbeddingGemma 2 processor needs both, even for text
    "transformers>=4.57",
    "torch>=2.6",
    "torchvision",
    "numpy",
    "pillow",
    "pyyaml",
    "pymupdf",
    "pypdf",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "starlette>=0.40",      # grain serve
    "uvicorn>=0.30",
    "watchdog>=4",          # live re-indexing
]

[project.optional-dependencies]
heic = ["pillow-heif"]  # iPhone photos

# Only for working on the code (installed by `uv sync`, never shipped to users).
[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",   # the tests build a sample PDF with it
]

[project.scripts]
grain = "grain_search.cli:main"

[project.urls]
Homepage = "https://github.com/saifu7/grain-search"
Issues = "https://github.com/saifu7/grain-search/issues"
Changelog = "https://github.com/saifu7/grain-search/blob/main/CHANGELOG.md"

# torch/torchvision come from the CUDA 12.8 build on Windows/Linux: it uses an NVIDIA GPU
# when there is one and still runs on the CPU when there isn't. (A default rather than an
# --extra, because `uv run` re-syncs to the default and would silently swap a GPU build
# back to the CPU one.) The installer will choose CPU or CUDA itself (roadmap Phase 4).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grain_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the real EmbeddingGemma 2 model download (skipped in CI)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "data-fake"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are wrapped by the formatter where it matters
    "B008",
    "B905",   # zip() without strict= is intentional in a few hot loops
]
